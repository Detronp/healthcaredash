services:
  web:
    build:
      context: .
      target: runtime
    image: healthsync-pro:1.0.0
    container_name: healthsync-pro
    ports:
      - "${HOST_PORT:-8080}:8000"
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "2"
      LOG_LEVEL: info
      # Set to "true" only when served over HTTPS (e.g. behind a TLS proxy).
      ENABLE_HSTS: "false"
    # Hardening: the app only reads its own files, so lock the container down.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
